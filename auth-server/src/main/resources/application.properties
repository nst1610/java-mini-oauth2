server.port=8080
spring.application.name=mini-auth

spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/auth;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AUTH_DB_USER:user}
spring.datasource.password=${AUTH_DB_PASSWORD:password}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false

logging.file.name=./logs/auth-server.log

auth.issuer=${AUTH_ISSUER:mini-auth}
auth.audience=${AUTH_AUDIENCE:payments-api}
auth.secret=${AUTH_SECRET:demo-only-secret-at-least-32-bytes-long}
auth.access-ttl-sec=${ACCESS_TTL_SEC:900}
auth.refresh-ttl-days=${REFRESH_TTL_DAYS:14}
auth.skew=${CLOCK_SKEW:30}
